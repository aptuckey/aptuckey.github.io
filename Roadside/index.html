<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Redirecting...</title>
  <!-- change REDIRECT_URL in the script below as needed -->
  <meta http-equiv="refresh" content="5;url=https://aptuckey.github.io/">
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:#243E36;color:#e6eef8;font-family:Inter,system-ui,Segoe UI,Roboto,Arial}
    .wrap{text-align:center}
    .msg{font-size:1.25rem;margin-bottom:20px}
    .spinner{
      width:72px;height:72px;border-radius:50%;display:inline-block;
      border:8px solid rgba(255,255,255,0.08);
      border-top-color:#7CA982; animation:spin 1s linear infinite;
      box-shadow:0 4px 14px rgba(2,6,23,0.6);
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .sub{margin-top:12px;color:rgba(230,238,248,0.8);font-size:0.95rem}
  </style>
</head>
<body>
  <div class="wrap" role="status" aria-live="polite">
    <div class="msg">My portfoloio is now at Chickadee-Labs.com — redirecting.</div>
    <div class="spinner" aria-hidden="true"></div>
    <div class="sub">You will be redirected in 5 seconds. If not, <a href="https://www.chickadee-labs.com/" style="color:#7CA982">click here</a>.</div>
  </div>

  <script>
    // Update the URL below if you want a different redirect target
    const REDIRECT_URL = 'https://www.chickadee-labs.com/';
    // fallback JS redirect in case meta refresh is blocked
    setTimeout(()=> { window.location.href = REDIRECT_URL; }, 5000);
  </script>
</body>
